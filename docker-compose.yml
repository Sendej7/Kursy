version: "3.9"

services:
  postgres:
    image: postgres:17-alpine
    container_name: kursy-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eduplatform
    ports:
      - "5432:5432"
    volumes:
      - kursy-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kursy-pg-data:
