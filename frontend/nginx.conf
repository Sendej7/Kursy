server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy do backendu (kontener "backend" w docker-compose network'u).
    # Frontend używa relatywnego /api/... — bez tego dostawalibyśmy 405 z nginx'a.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SignalR (NotificationsHub, LessonHub) — wymaga upgrade do WebSocket.
    location /hubs/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # sitemap.xml + swagger — też w backendzie
    location = /sitemap.xml {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
    location /swagger {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # PWA service worker — nie cache'ujemy, bo update musi być natychmiastowy.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Static assets z hashami w nazwie (Vite) — agresywny cache.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback — wszystkie nieznane ścieżki idą do index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check dla compose / orchestratora
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
