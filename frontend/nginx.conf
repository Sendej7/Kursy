server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # PWA service worker — nie cache'ujemy, bo update musi być natychmiastowy.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Static assets z hashami w nazwie (Vite) — agresywny cache.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback — wszystkie nieznane ścieżki idą do index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check dla compose / orchestratora
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
